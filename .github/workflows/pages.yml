name: Deploy web demo to GitHub Pages

# The web demo is plain static files (the web/ directory, with three.js already in web/vendor/): no build step, publish as is.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Upload and deploy run in separate jobs: when deploy-pages runs in the same job a fraction of a second
# after the upload, its artifact lookup can come back empty (actions/deploy-pages#451).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
